protocol_version: 3
objective: "Evaluate whether regime information improves Indian multi-asset portfolio risk after assumed costs."
hypothesis: "HMM allocation may control risk; alpha or profitability is not assumed."
data_history_disclosure: "The full historical sample and intermediate v3 results were inspected. Every historical split and model-selection attempt is retrospective; no pristine holdout exists."
asset_universe:
  equity: "^NSEI index; not an executable security"
  gold: "GOLDBEES.NS vendor adjusted-price proxy"
  defensive: "LIQUIDBEES.NS vendor adjusted-price cash proxy; distribution completeness unverified"
data_quality:
  canonical_csv: "data/submission_market_data.csv"
  preprocessing: "Spike-and-reversion masking uses up to five future observations. This is ex-post historical repair, not point-in-time data."
  causality_claim: "Causal model signals and next-close execution conditional on the retrospectively cleaned dataset only."
  cash_proxy_distribution_window: ["2013-01-01", "2025-09-30"]
  cash_proxy_window_note: "Vendor distribution-record span observed during audit, not certification of complete total returns."
execution:
  model: NEXT_CLOSE
  sequence: "Holdings earn the return ending t; prior-close target fills and costs are paid at t; new signal uses data through t and fills at t+1, first earning t+1-to-t+2."
  excluded: "Instrument fill guarantees, volume-constrained capacity, measured spreads and market impact."
cost_scenarios:
  optimistic: 5
  base: 10
  stressed: 20
  units: "Assumed one-way bps per unit of absolute traded asset weight."
splits:
  development: ["2010-01-01", "2018-12-31"]
  validation: ["2019-01-01", "2021-12-31"]
  retrospective_evaluation: ["2022-01-01", "2026-12-31"]
  interpretation: "Calendar attribution of continuous online runs; not independent model-selection folds."
walk_forward_selection:
  validation_years: 3
  decision: "Last close before each evaluation year."
  execution: "First session close of evaluation year; selector starts in cash and pays entry."
  attempt_A: "Maximum trailing net Sharpe at rf=0; retained despite always selecting near-cash minimum variance."
  attempt_B: "Maximum trailing Sharpe of net returns minus cash proxy; added retrospectively after inspecting attempt A."
  claim: "Retrospective test of fixed selection rules; not independent evidence of discovery."
hmm:
  states: 3
  covariance_type: diag
  restarts: 3
  selection: "Highest finite training likelihood among tolerance-converged restarts, finite-likelihood fallback disclosed."
  probabilities: "Filtered latent-state posterior at signal closes; not calibrated probabilities of future crashes."
statistics:
  annualization: 252
  sortino: "Mean excess return / sqrt(mean(min(excess,0)^2)) * sqrt(252), denominator over all dates."
  drawdown: "Running wealth peak includes initial capital 1.0."
  bootstrap: "Paired moving blocks 10/21/63 days, 2000 draws, seed 42; observation-centred two-sided tests, Holm family adjustment."
  dsr: "IID/non-normality approximation conditional on supplied correlated trial set; historical development trial count incomplete."
  cscv: "Fixed-trial selection-rank diagnostic; never a substitute for chronological validation."
parameter_policy: "No performance-driven tuning presented as unseen evaluation. Every attempt and negative result is retained."
future_evaluation: "Freeze source/config/training policy and dataset prefix before ingesting later local observations; post-release is not automatically prospective. No live trading."
historical_evidence: "results/archive/protocol_v2; original code and releases remain in git history."
