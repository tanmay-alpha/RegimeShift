[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regime_shift"
version = "1.0.0"
description = "Causal market-regime asset allocation research with walk-forward evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "tanmay-alpha"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "hmmlearn>=0.3.0",
    "cvxpy>=1.3.0",
    "yfinance>=0.2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/tanmay-alpha/RegimeShift"
Repository = "https://github.com/tanmay-alpha/RegimeShift"
Issues = "https://github.com/tanmay-alpha/RegimeShift/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
