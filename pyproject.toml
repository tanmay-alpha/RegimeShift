[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regime_shift"
version = "1.0.0"
description = "Causal regime-allocation research: 3-state HMM + CVXPY for Indian multi-asset portfolio"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "tanmay-alpha"},
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "hmmlearn>=0.3.0",
    "cvxpy>=1.3.0",
    "yfinance>=0.2.20",
]

[project.urls]
Repository = "https://github.com/tanmay-alpha/RegimeShift"
Issues = "https://github.com/tanmay-alpha/RegimeShift/issues"

[project.scripts]
regimeshift = "regime_shift.cli:main"

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
    "plotly>=5.18",
]
dev = [
    "pytest>=7.0.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
    "ruff>=0.1.0",
    "lxml>=4.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
